name: Release

# Push a tag such as v0.1.0 to publish that version to nuget.org.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build
        run: dotnet build BBTree.slnx -c Release -p:Version=$VERSION
      - name: Test
        run: dotnet test --project tests/BBTree.Tests -c Release --no-build
      - name: Pack
        run: dotnet pack src/BBTree -c Release --no-build -p:Version=$VERSION
      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/package/release/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/package/release/* --title "$GITHUB_REF_NAME" --generate-notes
