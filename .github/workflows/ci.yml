name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build BBTree.slnx -c Release
      # The runtime can leave AVX-512 unused on hardware that has it, so ask it which vector paths the tests take.
      - name: Report vector acceleration
        shell: bash
        run: |
          echo 'using System.Runtime.Intrinsics; System.Console.WriteLine($"Vector512: {Vector512.IsHardwareAccelerated}, Vector256: {Vector256.IsHardwareAccelerated}, Vector128: {Vector128.IsHardwareAccelerated}");' > "$RUNNER_TEMP/vectors.cs"
          dotnet run "$RUNNER_TEMP/vectors.cs"
      - name: Test
        run: dotnet test --project tests/BBTree.Tests -c Release --no-build
      - name: Test without AVX-512
        if: runner.arch == 'X64'
        run: dotnet test --project tests/BBTree.Tests -c Release --no-build
        env:
          DOTNET_TieredCompilation: 0
          DOTNET_EnableAVX512F: 0
      # Fully optimized code without the vector paths the default run takes: emulated vectors and 128-bit-only hardware.
      - name: Test without hardware intrinsics
        run: dotnet test --project tests/BBTree.Tests -c Release --no-build
        env:
          DOTNET_TieredCompilation: 0
          DOTNET_EnableHWIntrinsic: 0
      - name: Test without AVX2
        if: runner.arch == 'X64'
        run: dotnet test --project tests/BBTree.Tests -c Release --no-build
        env:
          DOTNET_TieredCompilation: 0
          DOTNET_EnableAVX2: 0
      - name: Check format
        run: dotnet format whitespace BBTree.slnx --verify-no-changes
      - name: Pack
        run: dotnet pack src/BBTree -c Release --no-build
