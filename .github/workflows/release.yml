name: Release

# Push a tag such as v0.1.0 to publish that version to nuget.org.
# Publishing uses nuget.org Trusted Publishing: a policy on nuget.org for this repository and this workflow file lets
# the job trade its GitHub OIDC token for a short-lived API key, so no key is stored. The NUGET_USER secret holds the
# nuget.org user name of the policy owner.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build
        run: dotnet build BBTree.slnx -c Release -p:Version=$VERSION
      - name: Test
        run: dotnet test --project tests/BBTree.Tests -c Release --no-build
      - name: Pack
        run: dotnet pack src/BBTree -c Release --no-build -p:Version=$VERSION
      - name: Log in to nuget.org
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/package/release/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/package/release/* --title "$GITHUB_REF_NAME" --generate-notes
